name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages for GUI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=src python -m pytest src/tests -q
