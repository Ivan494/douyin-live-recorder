name: build-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest src/tests

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $bin = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item (Join-Path $bin.FullName "bin\ffmpeg.exe") tools/
          Copy-Item (Join-Path $bin.FullName "bin\ffprobe.exe") tools/

      - name: Build release zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          ./scripts/build_release.ps1 -Version $ver -FfmpegDir tools

      - name: Publish release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          gh release create "${{ github.ref_name }}" `
            --title "Douyin Live Recorder v$ver" `
            --notes "Standalone Windows build. Unzip and run DouyinLiveRecorder.exe. ffmpeg is included; no Python install needed." `
            "dist/DouyinLiveRecorder-v$ver-win64.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
