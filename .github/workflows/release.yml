name: build-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest src/tests

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $zipUri = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $shaUri = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256"
          Invoke-WebRequest -Uri $zipUri -OutFile ffmpeg.zip
          Invoke-WebRequest -Uri $shaUri -OutFile ffmpeg.zip.sha256
          if ((Get-Item ffmpeg.zip).Length -lt 10MB) {
            throw "ffmpeg.zip download looks truncated"
          }
          $expected = ((Get-Content ffmpeg.zip.sha256 -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "ffmpeg.zip SHA256 mismatch: expected $expected got $actual"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $bin = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item (Join-Path $bin.FullName "bin\ffmpeg.exe") tools/
          Copy-Item (Join-Path $bin.FullName "bin\ffprobe.exe") tools/

      - name: Build release zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          ./scripts/build_release.ps1 -Version $ver -FfmpegDir tools

      - name: Publish release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          gh release create "${{ github.ref_name }}" --title "抖音直播录制 v$ver" --notes-file .github/release-notes.md --latest "dist/DouyinLiveRecorder-v$ver-win64.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
