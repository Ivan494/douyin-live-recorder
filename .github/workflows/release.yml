name: build-release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '仅构建验证，不发布（X.Y.Z）'
        required: true
        default: '1.2.11'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = '1.2.11'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          elseif ($env:REQUESTED_VERSION) { $version = $env:REQUESTED_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Review a new archive and its digest together before updating this pin.
          $uri = 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip'
          $expected = 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec'
          Invoke-WebRequest -Uri $uri -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'FFmpeg checksum mismatch' }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $bins = @(Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe -File)
          if ($bins.Count -ne 1) { throw 'Unexpected FFmpeg archive layout' }
          Copy-Item -LiteralPath $bins[0].FullName -Destination tools/
          Copy-Item -LiteralPath (Join-Path $bins[0].DirectoryName 'ffprobe.exe') -Destination tools/
      - name: Verify source privacy and run regression tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          $env:DOUYIN_TEST_TOOLS_DIR = (Resolve-Path tools).Path
          python scripts/release_artifacts.py --source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest src/tests scripts/test_release_defaults.py scripts/test_release_artifacts.py -q -W error::pytest.PytestUnraisableExceptionWarning
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test_release_launcher.ps1
      - name: Build, inspect, extract and run release self-test
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build_release.ps1 -Version $env:RELEASE_VERSION -FfmpegDir tools
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/DouyinLiveRecorder-v${{ steps.version.outputs.version }}-win64.zip
            dist/SHA256SUMS.txt

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: Verify assets and publish completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $zip = "release/DouyinLiveRecorder-v$env:RELEASE_VERSION-win64.zip"
          $expected = ((Get-Content release/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Asset checksum mismatch' }
          python scripts/release_artifacts.py --zip $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $template = Get-Content -LiteralPath .github/release-notes.md -Raw -Encoding utf8
          if (([regex]::Matches($template, '@VERSION@')).Count -ne 1) { throw 'Release notes must contain one version placeholder' }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-v$env:RELEASE_VERSION.md"
          Set-Content -LiteralPath $notesFile -Value $template.Replace('@VERSION@', $env:RELEASE_VERSION) -Encoding utf8
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "抖音直播录制 v$env:RELEASE_VERSION" --notes-file $notesFile $zip release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
