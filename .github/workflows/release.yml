name: build-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest src/tests

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $bin = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item (Join-Path $bin.FullName "bin\ffmpeg.exe") tools/
          Copy-Item (Join-Path $bin.FullName "bin\ffprobe.exe") tools/

      - name: Build release zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          ./scripts/build_release.ps1 -Version $ver -FfmpegDir tools

      - name: Publish release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $notes = @"
独立 Windows 便携包。解压后运行 DouyinLiveRecorder.exe。已内置 ffmpeg，无需安装 Python。

界面默认简体中文，可在设置里改成 English。

v$ver：
- 每个资料可单独关闭「录制直播」，只自动下载作品和日常
"@
          gh release create "${{ github.ref_name }}" `
            --title "抖音直播录制 v$ver" `
            --notes $notes `
            --latest `
            "dist/DouyinLiveRecorder-v$ver-win64.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
